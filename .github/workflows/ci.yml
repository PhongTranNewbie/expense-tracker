name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/expense_tracker_ci?sslmode=require
      DIRECT_URL: postgresql://ci:ci@localhost:5432/expense_tracker_ci?sslmode=require
      AUTH_SECRET: ci-auth-secret
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ci-github-client-id
      AUTH_GITHUB_SECRET: ci-github-client-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
